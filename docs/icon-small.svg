<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- TaskTick app icon — small detail level (16 / 32px slots: menu bar, Finder
       list view, Spotlight rows).
       At 16px one SVG unit is 1/64 of a pixel, so everything that isn't a large
       filled shape disappears. What's left: the dial, two hands, and the badge.
       Markers, gradients and shadows are all dropped — gradients band and
       shadows smear at this size — and the badge keeps only the chevron, since
       the underscore would collide with it inside 4 pixels. The badge is also
       enlarged relative to the dial: at 16px it is the only thing that
       distinguishes this icon from any other clock. See scripts/make-icon.sh. -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f5f8"/>
    </linearGradient>
  </defs>
  <!-- Apple's macOS icon grid: the rounded square is 824 px inside the 1024 canvas, centred,
       with transparent margin around it. macOS 15 and earlier draw the artwork as is, so a
       full-bleed square showed ~24% larger than every other Dock icon (issue #57); macOS 26+
       re-frames icons itself, which is why it looked fine there. -->
  <g transform="translate(100 100) scale(0.8046875)">


  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>

  <circle cx="486" cy="470" r="330" fill="#616c82"/>

  <path d="M 486 470 L 486 296" stroke="#ffffff" stroke-width="52" stroke-linecap="round"/>
  <path d="M 486 470 L 630 384" stroke="#a7f3c4" stroke-width="44" stroke-linecap="round"/>

  <circle cx="770" cy="768" r="196" fill="url(#bg)"/>
  <circle cx="770" cy="768" r="166" fill="#22c55e"/>
  <path d="M 724 712 L 800 768 L 724 824" fill="none" stroke="#ffffff" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
