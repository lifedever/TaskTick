<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- TaskTick app icon — large detail level (256px and up).
       Companions: icon-medium.svg (64/128), icon-small.svg (16/32).
       All three are rendered into AppIcon.icns by scripts/make-icon.sh;
       macOS picks the right one per slot, so each can carry the amount of
       detail that survives at its size. -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f3f6"/>
    </linearGradient>
    <!-- Slate blue-grey dial: enough weight to hold the white canvas, light
         enough not to read as a black puck. -->
    <linearGradient id="dial" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#77839a"/>
      <stop offset="100%" stop-color="#525d72"/>
    </linearGradient>
    <filter id="dialShadow" x="-25%" y="-25%" width="150%" height="165%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#2b3140" flood-opacity="0.28"/>
    </filter>
    <filter id="badgeShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1e2430" flood-opacity="0.22"/>
    </filter>
  </defs>
  <!-- Apple's macOS icon grid: the rounded square is 824 px inside the 1024 canvas, centred,
       with transparent margin around it. macOS 15 and earlier draw the artwork as is, so a
       full-bleed square showed ~24% larger than every other Dock icon (issue #57); macOS 26+
       re-frames icons itself, which is why it looked fine there. -->
  <g transform="translate(100 100) scale(0.8046875)">


  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="230" fill="none" stroke="rgba(70,75,110,0.10)" stroke-width="6"/>

  <!-- Dial. Centre sits 22px above the canvas centre so the badge, which hangs
       off the bottom-right, doesn't drag the whole composition low. -->
  <circle cx="512" cy="490" r="326" fill="url(#dial)" filter="url(#dialShadow)"/>

  <!-- Three markers, not twelve. 12 o'clock carries the orientation and is
       brightest; 3 and 9 just close the axis. 6 o'clock is omitted — the badge
       covers it. -->
  <path d="M 512 208 L 512 256" stroke="#ffffff" stroke-width="28" stroke-linecap="round" opacity="0.9"/>
  <path d="M 770 490 L 818 490" stroke="#ffffff" stroke-width="28" stroke-linecap="round" opacity="0.45"/>
  <path d="M 206 490 L 254 490" stroke="#ffffff" stroke-width="28" stroke-linecap="round" opacity="0.45"/>

  <!-- Hands: white hour hand for contrast, mint minute hand tying back to the
       badge's green. -->
  <path d="M 512 490 L 512 336" stroke="#ffffff" stroke-width="36" stroke-linecap="round"/>
  <path d="M 512 490 L 642 412" stroke="#86efac" stroke-width="28" stroke-linecap="round"/>
  <circle cx="512" cy="490" r="26" fill="#86efac"/>

  <!-- Badge: the shell prompt, in the slot the old check mark used to hold.
       Scheduling stays the subject; the badge says what it is that gets run. -->
  <circle cx="774" cy="766" r="158" fill="url(#bg)" filter="url(#badgeShadow)"/>
  <circle cx="774" cy="766" r="130" fill="#22c55e"/>
  <path d="M 726 724 L 784 766 L 726 808" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 812 810 L 846 810" stroke="#ffffff" stroke-width="26" stroke-linecap="round"/>
  </g>
</svg>
